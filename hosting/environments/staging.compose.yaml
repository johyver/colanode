# DESIGN-ONLY P1-05 Synology staging candidate. NOT DEPLOYED.
# Requires explicit approval, verified NAS capacity, ARM64 pulls, TLS gateway,
# separate secrets, and signed immutable application image digests.
# All services are opt-in profile and none publish host ports.
name: colanode-p105-staging

services:
  postgres:
    profiles: [approved-staging-only]
    image: pgvector/pgvector:pg17
    restart: "no"
    environment:
      POSTGRES_DB: colanode_staging
      POSTGRES_USER: colanode_staging
      POSTGRES_PASSWORD_FILE: /run/secrets/staging_pg_password
    secrets: [staging_pg_password]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colanode_staging -d colanode_staging"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  valkey:
    profiles: [approved-staging-only]
    image: valkey/valkey:8.1
    restart: "no"
    command: ["valkey-server", "/run/secrets/staging_valkey_conf"]
    secrets: [staging_valkey_conf]
    volumes: ["valkey_data:/data"]
    networks: [private]
    security_opt: ["no-new-privileges:true"]

  server:
    profiles: [approved-staging-only]
    # Invalid registry placeholder: must be replaced by an approved digest.
    image: registry.example.invalid/colanode/server:UNVERIFIED-DO-NOT-DEPLOY
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_started}
    env_file:
      - ./unavailable-requires-separate-approval/server.env
    volumes: ["server_files:/var/lib/colanode/storage"]
    networks: [private, ingress]
    expose: ["3000"]
    security_opt: ["no-new-privileges:true"]

  web:
    profiles: [approved-staging-only]
    image: registry.example.invalid/colanode/web:UNVERIFIED-DO-NOT-DEPLOY
    restart: "no"
    networks: [ingress]
    expose: ["80"]
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
  valkey_data:
  server_files:

networks:
  private:
    driver: bridge
    internal: true
  ingress:
    driver: bridge
    # TLS reverse proxy attaches only after separate approval.

secrets:
  staging_pg_password:
    file: ./unavailable-requires-separate-approval/postgres.password
  staging_valkey_conf:
    file: ./unavailable-requires-separate-approval/valkey.conf
