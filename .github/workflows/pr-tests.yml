name: PR - Colanode quality and security

on:
  pull_request:
    branches:
      - main
      - develop/colanode-custom
  workflow_dispatch:

# Checks run on isolated GitHub runners with no production or Notion credentials.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Lint all packages with lint scripts
        run: npx turbo run lint --parallel

  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Clean install from committed lockfile
        run: npm ci --no-audit --no-fund
      - name: Verify patched Metro image-size compatibility
        run: node scripts/verify-metro-image-size.mjs
      - name: Build backend and web dependencies
        run: npx turbo run build --filter=@colanode/server --filter=@colanode/web
      # Server Vitest tests use disposable Postgres and Redis Testcontainers on
      # GitHub-hosted runners. No local DEV or production services are accessed.
      - name: Unit and integration tests (server, web, CRDT, core)
        run: npx turbo run test --filter=@colanode/server --filter=@colanode/web --filter=@colanode/crdt --filter=@colanode/core -- --run --testTimeout=15000

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      # Fail closed on reported high/critical production dependencies.
      # Known baseline advisories are tracked in P1-03A; never silently
      # suppress them or turn this job into an optional check.
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high --json > npm-audit-report.json
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-production
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 7
